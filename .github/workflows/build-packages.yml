name: Build and Release Packages

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Package version (e.g., 1.0.0)"
        required: true
        default: "1.0.0"

jobs:
  build-deb:
    name: Build Debian Package
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.VERSION }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Determine Version
        id: get_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="1.0.0-dev"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Make Build Script Executable
        run: chmod +x build_deb.sh

      - name: Build Debian Package
        run: ./build_deb.sh "${{ steps.get_version.outputs.VERSION }}-1"

      - name: Upload Debian Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: drcwrapper-debian-package
          path: "*.deb"
          retention-days: 7

  build-arch:
    name: Build Arch Linux Package
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - name: Install Build Dependencies
        run: |
          pacman -Syu --noconfirm git base-devel

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure Safe Directory & Non-Root User
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Determine Version
        id: get_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="1.0.0.dev"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Make Build Script Executable
        run: chmod +x build_arch.sh

      - name: Build Arch Package as Non-Root User
        run: |
          su builder -c "./build_arch.sh ${{ steps.get_version.outputs.VERSION }}"

      - name: Upload Arch Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: drcwrapper-arch-package
          path: "*.pkg.tar.zst"
          retention-days: 7

  release:
    name: Create GitHub Release
    needs: [build-deb, build-arch]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download Debian Artifact
        uses: actions/download-artifact@v4
        with:
          name: drcwrapper-debian-package

      - name: Download Arch Artifact
        uses: actions/download-artifact@v4
        with:
          name: drcwrapper-arch-package

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.deb
            *.pkg.tar.zst
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
