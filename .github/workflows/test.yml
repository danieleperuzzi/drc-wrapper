name: Test

on:
  workflow_call:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install test dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm base-devel git sudo bash shellcheck sox bc

      - name: Install drc from AUR
        run: |
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          install -d -o builder -g builder /tmp/aur
          su builder -c '
            set -e
            cd /tmp/aur
            curl -L -o drc.tar.gz https://aur.archlinux.org/cgit/aur.git/snapshot/drc.tar.gz
            tar -xzf drc.tar.gz
            cd drc
            makepkg --noconfirm -si --needed
          '

      - name: Bash syntax check
        run: bash -n drcwrapper

      - name: Shellcheck
        run: shellcheck drcwrapper

      - name: Help smoke test (short)
        run: ./drcwrapper -h

      - name: Help smoke test (long)
        run: ./drcwrapper --help

      - name: Real end-to-end execution (two inputs)
        run: |
          rm -rf out drc_out_*
          ./drcwrapper \
            --mic-compensation test/ecm8000-44.1KHz.txt \
            --target-curve test/target_curve_file_flat \
            --window-exponent 0.85 \
            --lower-window 525 \
            --upper-window 1 \
            test/ImpulseLeft.wav \
            test/ImpulseRight.wav

      - name: Verify generated outputs
        run: |
          latest_out="$(ls -d drc_out_* 2>/dev/null | sort | tail -n 1)"
          [ -n "$latest_out" ]
          test -f "$latest_out/wav/ImpulseLeft_mic_compensated_impulse_response.wav"
          test -f "$latest_out/wav/ImpulseLeft.wav"
          test -f "$latest_out/wav/ImpulseLeft_minimum_phase.wav"
          test -f "$latest_out/wav/ImpulseLeft_test_convolution.wav"
          test -f "$latest_out/wav/ImpulseRight_mic_compensated_impulse_response.wav"
          test -f "$latest_out/wav/ImpulseRight.wav"
          test -f "$latest_out/wav/ImpulseRight_minimum_phase.wav"
          test -f "$latest_out/wav/ImpulseRight_test_convolution.wav"
